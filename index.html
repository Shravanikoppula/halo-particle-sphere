<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halo — hand-controlled particle sphere</title>
<meta name="description" content="A 3D particle sphere you control with your hand. Open your palm to explode it, close your fist to collapse it. Runs fully in your browser.">
<meta name="theme-color" content="#05060d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<style>
  :root{--bg:#05060d;--ink:#e8ecff;--mute:#8d94b8;--glass:rgba(16,18,36,.62);--line:rgba(160,175,255,.16);--acc:#7c9cff}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .btn{transition:transform .15s,background .2s,border-color .2s}
  .btn:hover{border-color:var(--acc)}.btn:active{transform:scale(.96)}
  .btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  #pv{transform:scaleX(-1)}
  .dot{width:8px;height:8px;border-radius:99px;background:#667;transition:background .2s,box-shadow .2s}
  .dot.on{background:#4ade80;box-shadow:0 0 10px #4ade80}
  .fade{transition:opacity .5s,visibility .5s}.hide{opacity:0;visibility:hidden;pointer-events:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive 3D particle sphere"></canvas>

<!-- Top bar -->
<header class="fixed top-0 inset-x-0 p-4 flex items-start justify-between pointer-events-none" style="padding-top:max(1rem,env(safe-area-inset-top))">
  <div class="pointer-events-auto">
    <h1 class="text-xl font-semibold tracking-tight">Halo</h1>
    <p class="text-sm" style="color:var(--mute)">Shape light with your hand.</p>
  </div>
  <div id="chip" class="glass rounded-full px-3 py-1.5 text-sm flex items-center gap-2 pointer-events-auto hide">
    <span id="dot" class="dot"></span><span id="status">Starting…</span>
  </div>
</header>

<!-- Hint -->
<p id="hint" class="fixed left-1/2 -translate-x-1/2 text-center text-sm px-4 fade hide" style="bottom:calc(5.5rem + env(safe-area-inset-bottom));color:var(--mute)"></p>

<!-- Controls -->
<nav id="controls" class="fixed bottom-0 inset-x-0 p-4 flex items-end justify-between fade hide" style="padding-bottom:max(1rem,env(safe-area-inset-bottom))">
  <div class="glass rounded-2xl overflow-hidden relative" id="pvWrap" style="width:160px;height:120px">
    <canvas id="pv" width="160" height="120" class="w-full h-full block"></canvas>
    <span id="fps" class="absolute top-1 left-2 text-[11px]" style="color:var(--mute)"></span>
  </div>
  <div class="flex gap-2">
    <button id="bPal" class="btn glass rounded-xl px-4 py-2.5 text-sm" aria-label="Change colors">Colors: <span id="palName">Aurora</span></button>
    <button id="bPv" class="btn glass rounded-xl px-4 py-2.5 text-sm" aria-label="Toggle camera preview">Preview</button>
    <button id="bFs" class="btn glass rounded-xl px-4 py-2.5 text-sm hidden sm:block" aria-label="Fullscreen">Fullscreen</button>
  </div>
</nav>

<!-- Start screen -->
<main id="start" class="fixed inset-0 flex items-center justify-center p-6 fade" style="background:radial-gradient(ellipse at center,rgba(5,6,13,.35),rgba(5,6,13,.88))">
  <section class="glass rounded-3xl p-8 max-w-md w-full text-center shadow-2xl">
    <h2 class="text-3xl font-semibold tracking-tight mb-2">Control a sphere of light</h2>
    <p class="mb-6 leading-relaxed" style="color:var(--mute)">Open your palm to explode it. Close your fist to pull it tight. Move your hand to steer it.</p>
    <button id="bCam" class="btn w-full rounded-xl py-3.5 font-medium text-[#05060d]" style="background:var(--acc)">Start camera</button>
    <button id="bMouse" class="btn w-full rounded-xl py-3 mt-3 text-sm glass">Use mouse or touch instead</button>
    <p id="err" class="mt-4 text-sm text-red-300 hidden" role="alert"></p>
    <p class="mt-5 text-xs" style="color:var(--mute)">Video stays on your device. Nothing is recorded or uploaded.</p>
  </section>
</main>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const showErr = m => { const e=$('err'); e.textContent=m; e.classList.remove('hidden'); };

if (typeof THREE === 'undefined') { showErr('3D engine failed to load. Check your connection and reload.'); $('bCam').disabled=$('bMouse').disabled=true; return; }

/* ---------- Three.js scene ---------- */
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas:$('c'), antialias:false, alpha:false, powerPreference:'high-performance'}); }
catch(e){ showErr('WebGL is not available in this browser.'); $('bCam').disabled=$('bMouse').disabled=true; return; }
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
renderer.setClearColor(0x05060d, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, .1, 100);
camera.position.z = 7;
const HALF_H = Math.tan(THREE.MathUtils.degToRad(30)) * 7;

const N = (innerWidth < 700 || /Mobi|Android/i.test(navigator.userAgent)) ? 4500 : 8000;
const pos = new Float32Array(N*3), col = new Float32Array(N*3), vel = new Float32Array(N*3);
const base = new Float32Array(N*3), seed = new Float32Array(N);
const ga = Math.PI * (3 - Math.sqrt(5));
for (let i=0;i<N;i++){
  const y = 1 - (i/(N-1))*2, r = Math.sqrt(1-y*y), th = ga*i;
  base[i*3]=Math.cos(th)*r; base[i*3+1]=y; base[i*3+2]=Math.sin(th)*r;
  seed[i]=Math.random();
  pos[i*3]=base[i*3]*1.6; pos[i*3+1]=base[i*3+1]*1.6; pos[i*3+2]=base[i*3+2]*1.6;
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
geo.setAttribute('color', new THREE.BufferAttribute(col,3));

const tc = document.createElement('canvas'); tc.width=tc.height=64;
const tg = tc.getContext('2d'), gr = tg.createRadialGradient(32,32,0,32,32,32);
gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.35,'rgba(255,255,255,.45)'); gr.addColorStop(1,'rgba(255,255,255,0)');
tg.fillStyle=gr; tg.fillRect(0,0,64,64);
const mat = new THREE.PointsMaterial({size:.06, map:new THREE.CanvasTexture(tc), vertexColors:true, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true});
const points = new THREE.Points(geo, mat);
points.frustumCulled = false;
scene.add(points);

const PALETTES = [
  {n:'Aurora', a:[.50,.80]}, {n:'Ember', a:[.98,.13]}, {n:'Lagoon', a:[.38,.60]}, {n:'Orchid', a:[.75,.95]}
];
let pal = 0;
function applyPalette(){
  const [h1,h2] = PALETTES[pal].a, c = new THREE.Color();
  for (let i=0;i<N;i++){
    const t = (base[i*3+1]+1)/2;
    c.setHSL((h1+(h2-h1)*t+1)%1, .85, .55 + seed[i]*.15);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  geo.attributes.color.needsUpdate = true;
  $('palName').textContent = PALETTES[pal].n;
}
applyPalette();

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix();
  camera.position.z = w/h < .8 ? 9 : 7;
}
addEventListener('resize', resize); resize();
$('c').addEventListener('webglcontextlost', e => { e.preventDefault(); setStatus('Graphics paused — reload if it does not recover', false); });

/* ---------- Input state ---------- */
const tgt = {x:0, y:0, open:.5, present:false}, cur = {x:0, y:0, open:.5};
let mode = 'idle', lastSeen = 0, pointerDown = false;

/* ---------- UI helpers ---------- */
function setStatus(t, on){ $('status').textContent=t; $('dot').classList.toggle('on', !!on); }
function showHint(t){ const h=$('hint'); h.textContent=t; h.classList.remove('hide'); }
function enterApp(){
  $('start').classList.add('hide'); $('controls').classList.remove('hide'); $('chip').classList.remove('hide');
  setTimeout(()=>$('hint').classList.add('hide'), 9000);
}
$('bPal').onclick = () => { pal=(pal+1)%PALETTES.length; applyPalette(); };
$('bPv').onclick = () => $('pvWrap').classList.toggle('hidden');
$('bFs').onclick = () => { try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }catch(e){} };

/* ---------- Mouse / touch fallback ---------- */
function startPointer(){
  mode = 'pointer'; enterApp(); $('pvWrap').classList.add('hidden'); $('bPv').classList.add('hidden');
  setStatus('Mouse mode', true); showHint('Move to steer. Press and hold to explode.');
  const move = e => { tgt.x = (e.clientX/innerWidth*2-1)*HALF_H*camera.aspect*.8; tgt.y = -(e.clientY/innerHeight*2-1)*HALF_H*.8; tgt.present = true; };
  addEventListener('pointermove', move);
  addEventListener('pointerdown', e => { move(e); pointerDown = true; });
  addEventListener('pointerup', () => pointerDown = false);
  addEventListener('pointercancel', () => pointerDown = false);
}
$('bMouse').onclick = startPointer;

/* ---------- Hand tracking ---------- */
const video = document.createElement('video'); video.playsInline = true; video.muted = true;
const pv = $('pv'), pctx = pv.getContext('2d');
let hands = null, stream = null, busy = false, trackFails = 0;
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);

function onResults(r){
  const lm = r.multiHandLandmarks && r.multiHandLandmarks[0];
  pctx.drawImage(video, 0, 0, pv.width, pv.height);
  if (!lm){ return; }
  lastSeen = performance.now();
  const palm = Math.max(dist(lm[0], lm[9]), 1e-3);
  const avg = (dist(lm[8],lm[0]) + dist(lm[12],lm[0]) + dist(lm[16],lm[0]) + dist(lm[20],lm[0])) / 4 / palm;
  tgt.open = clamp((avg - 1.25) / 0.95, 0, 1);
  tgt.x = ((1 - lm[9].x) * 2 - 1) * HALF_H * camera.aspect * .8;
  tgt.y = -(lm[9].y * 2 - 1) * HALF_H * .8;
  tgt.present = true;
  pctx.fillStyle = '#7c9cff';
  for (const p of lm){ pctx.beginPath(); pctx.arc(p.x*pv.width, p.y*pv.height, 2.5, 0, 6.283); pctx.fill(); }
}

async function track(){
  if (mode !== 'camera') return;
  if (!busy && video.readyState >= 2){
    busy = true;
    try { await hands.send({image: video}); trackFails = 0; }
    catch(e){ if (++trackFails > 20){ fallback('Hand tracking stopped. Switched to mouse mode.'); return; } }
    busy = false;
  }
  requestAnimationFrame(track);
}

function fallback(msg){
  mode='idle'; if (stream) stream.getTracks().forEach(t=>t.stop());
  $('start').classList.remove('hide'); $('controls').classList.add('hide'); $('chip').classList.add('hide');
  showErr(msg); $('bCam').disabled=false; $('bCam').textContent='Try camera again';
}

async function startCamera(){
  const btn = $('bCam'); btn.disabled = true; btn.textContent = 'Starting camera…'; $('err').classList.add('hidden');
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Camera access needs a secure (HTTPS) page and a modern browser.');
    if (typeof Hands === 'undefined') throw new Error('Hand-tracking library failed to load. Check your connection and reload.');
    try { stream = await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640}, height:{ideal:480}, facingMode:'user'}, audio:false}); }
    catch(e){
      throw new Error(e && e.name === 'NotAllowedError' ? 'Camera permission was blocked. Allow it in your browser’s address bar, then try again.'
        : e && e.name === 'NotFoundError' ? 'No camera found on this device.' : 'Could not open the camera. Close other apps using it and try again.');
    }
    video.srcObject = stream; await video.play();
    btn.textContent = 'Loading hand model…';
    hands = new Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
    hands.setOptions({maxNumHands:1, modelComplexity:1, minDetectionConfidence:.6, minTrackingConfidence:.5});
    hands.onResults(onResults);
    await Promise.race([hands.initialize(), new Promise((_,rej)=>setTimeout(()=>rej(new Error('Hand model took too long to load. Check your connection and try again.')), 30000))]);
    mode = 'camera'; enterApp();
    setStatus('Show your hand', false); showHint('Open palm: explode. Fist: collapse. Move to steer.');
    track();
  } catch(e){
    if (stream) stream.getTracks().forEach(t=>t.stop());
    mode='idle'; showErr(e.message || 'Something went wrong starting the camera.');
    btn.disabled = false; btn.textContent = 'Try again';
  }
}
$('bCam').onclick = startCamera;

/* ---------- Render loop ---------- */
const clock = new THREE.Clock();
let t = 0, angle = 0, prevOpen = .5, burst = 0, frames = 0, fpsT = 0, cx = 0, cy = 0;

function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05); t += dt;

  if (mode === 'camera'){
    const seen = performance.now() - lastSeen < 700;
    tgt.present = seen;
    if (seen !== frame.seen){ frame.seen = seen; setStatus(seen ? 'Hand detected' : 'Show your hand', seen); }
  } else if (mode === 'pointer'){ tgt.open = pointerDown ? 1 : .3; }

  const k = Math.min(1, dt*9);
  const px = tgt.present ? tgt.x : 0, py = tgt.present ? tgt.y : 0;
  cx += (px-cx)*Math.min(1,dt*6); cy += (py-cy)*Math.min(1,dt*6);
  cur.open += ((tgt.present ? tgt.open : .5) - cur.open) * k;

  if (dt > 0 && (cur.open - prevOpen)/dt > 2.6) burst = 1;
  prevOpen = cur.open;

  const idleBreath = 1 + Math.sin(t*1.2)*.04;
  const scale = tgt.present ? .45 + cur.open*1.9 : idleBreath;
  const R = 1.6 * scale, spread = Math.max(0, cur.open - .55) * 2.2 * (tgt.present ? 1 : 0);
  angle += dt * (.25 + (tgt.present ? (cx/HALF_H)*.5 + (1-cur.open)*.5 : 0));
  const ca = Math.cos(angle), sa = Math.sin(angle);
  const spring = 16, damp = Math.exp(-dt*3.4), bs = burst * 9;

  for (let i=0;i<N;i++){
    const j = i*3, s = seed[i];
    const bx = base[j]*ca + base[j+2]*sa, by = base[j+1], bz = -base[j]*sa + base[j+2]*ca;
    const rr = R * (1 + s*spread) * (1 + .05*Math.sin(t*1.6 + s*6.283));
    const tx = cx + bx*rr, ty = cy + by*rr, tz = bz*rr;
    if (bs){ const f = bs*(.4+s); vel[j]+=bx*f; vel[j+1]+=by*f; vel[j+2]+=bz*f; }
    vel[j]   = (vel[j]   + (tx-pos[j])  *spring*dt) * damp;
    vel[j+1] = (vel[j+1] + (ty-pos[j+1])*spring*dt) * damp;
    vel[j+2] = (vel[j+2] + (tz-pos[j+2])*spring*dt) * damp;
    pos[j]+=vel[j]*dt; pos[j+1]+=vel[j+1]*dt; pos[j+2]+=vel[j+2]*dt;
  }
  burst = 0;
  geo.attributes.position.needsUpdate = true;
  renderer.render(scene, camera);

  frames++; fpsT += dt;
  if (fpsT >= 1){ $('fps').textContent = Math.round(frames/fpsT) + ' fps'; frames = 0; fpsT = 0; }
}
frame();
document.addEventListener('visibilitychange', () => clock.getDelta());
})();
</script>
</body>
</html>
